name: Update Kokansad News

on:
  schedule:
    - cron: '7,22,37,52 * * * *' # दर १५ मिनिटांनी रन होईल
  workflow_dispatch:       # तुम्हाला हवे तेव्हा मॅन्युअली रन करण्यासाठी

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 yt-dlp

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push news.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update news" && git push)
