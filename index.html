<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A0989">
  <title>Kokansad Live App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Mukta', sans-serif;
      background-color: #f4f6f9;
      color: #1a1a1a;
      padding-bottom: 24px;
    }

    /* App Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 200;
      height: 54px;
      background: #0A0989;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 2px 10px rgba(10, 9, 137, 0.25);
    }
    .app-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    .menu-btn {
      background: rgba(255, 255, 255, 0.14);
      border: none;
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .menu-btn:active { background: rgba(255, 255, 255, 0.25); }

    /* Right Slide Drawer Menu */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 300;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }
    .drawer-overlay.open { opacity: 1; visibility: visible; }
    .side-drawer {
      position: fixed;
      top: 0;
      right: -270px;
      width: 260px;
      height: 100vh;
      background: #ffffff;
      z-index: 301;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.18);
      transition: right 0.25s ease;
      display: flex;
      flex-direction: column;
    }
    .side-drawer.open { right: 0; }
    .drawer-header {
      background: #0A0989;
      color: #ffffff;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-header span { font-size: 18px; font-weight: 700; }
    .drawer-close {
      background: rgba(255,255,255,0.18);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .drawer-list {
      list-style: none;
      padding: 10px;
      overflow-y: auto;
      flex: 1;
    }
    .drawer-item {
      width: 100%;
      text-align: left;
      padding: 11px 14px;
      margin-bottom: 4px;
      border: none;
      border-radius: 10px;
      background: transparent;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      color: #222;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-item.active {
      background: #eef2ff;
      color: #0A0989;
      font-weight: 700;
    }
    .drawer-item:active { background: #e0e7ff; }

    /* Drawer Bottom Actions (Share & Rate) */
    .drawer-footer {
      padding: 12px;
      border-top: 1px solid #e5e7eb;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .drawer-action-btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.15s ease;
    }
    .drawer-action-btn:active { transform: scale(0.97); }
    .btn-share {
      background: #e0e7ff;
      color: #0A0989;
    }
    .btn-rate {
      background: #fef3c7;
      color: #b45309;
    }

    /* Sticky Category Tabs */
    .tabs-container {
      position: sticky;
      top: 54px;
      z-index: 150;
      background: #ffffff;
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      scrollbar-width: none;
    }
    .tabs-container::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 0 0 auto;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid #e0e0e0;
      background: #f8f9fa;
      color: #333;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #0A0989;
      color: #ffffff;
      border-color: #0A0989;
    }

    .container-wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 12px;
    }

    /* Live TV Wrapper & Retro TV Frame */
    .tv-wrapper {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* TV च्या वरचे अँटेना */
    .tv-antennas {
      position: relative;
      width: 60px;
      height: 16px;
    }
    .tv-antennas::before,
    .tv-antennas::after {
      content: "";
      position: absolute;
      bottom: -2px;
      width: 5px;
      height: 22px;
      background: #1a2a47;
      border-radius: 4px;
    }
    .tv-antennas::before {
      left: 16px;
      transform: rotate(-38deg);
    }
    .tv-antennas::after {
      right: 16px;
      transform: rotate(38deg);
    }

    /* TV ची मुख्य फ्रेम */
    .tv-frame {
      width: 100%;
      background: #1a2a47;
      padding: 8px 8px 10px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(10, 9, 137, 0.22);
    }
    .tv-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: 10px;
      overflow: hidden;
    }
    .tv-box iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* TV च्या खालील User-Friendly कंट्रोल बार */
    .tv-bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      padding: 0 4px;
      gap: 8px;
    }
    .tv-live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
    }
    .live-dot {
      width: 9px;
      height: 9px;
      background: #ef4444;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .tv-action-btns {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tv-ctrl-btn {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 8px;
      padding: 5px 11px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .tv-ctrl-btn:active { background: rgba(255, 255, 255, 0.28); }
    .tv-ctrl-btn.fs-primary {
      background: #2563eb;
      border-color: #3b82f6;
    }

    /* Full Screen मधोमध, 16:9 अचूक मापात, Scroll न होता आणि Black Background */
    .tv-box.is-fullscreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
      background: #000000;
      border-radius: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .tv-box.is-fullscreen iframe {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
    }
    .fs-exit-btn {
      display: none;
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      padding: 6px 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .tv-box.is-fullscreen .fs-exit-btn { display: block; }

    /* Mini-Player (इतर टॅबवर असताना तळाशी उजवीकडे) */
    .tv-box.is-minimized {
      position: fixed;
      bottom: 14px;
      right: 14px;
      width: 190px;
      aspect-ratio: 16 / 9;
      z-index: 250;
      border-radius: 10px;
      border: 2px solid #ffffff;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.38);
    }
    .mini-controls {
      display: none;
      position: absolute;
      top: 4px;
      right: 4px;
      gap: 4px;
      z-index: 12;
    }
    .tv-box.is-minimized .mini-controls { display: flex; }
    .mini-btn {
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 5px;
      width: 24px;
      height: 24px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* E-Paper Attractive Banner */
    .epaper-banner {
      margin-top: 12px;
      background: linear-gradient(135deg, #991b1b 0%, #dc2626 55%, #ea580c 100%);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.28);
      transition: transform 0.15s ease;
    }
    .epaper-banner:active { transform: scale(0.98); }
    .epaper-left { display: flex; align-items: center; gap: 12px; }
    .epaper-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .epaper-title { font-size: 19px; font-weight: 800; line-height: 1.2; }
    .epaper-tagline { font-size: 13px; opacity: 0.92; margin-top: 2px; }
    .epaper-cta {
      background: #ffffff;
      color: #b91c1c;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* News Grid */
    .news-container {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 600px) {
      .news-container { grid-template-columns: 1fr 1fr; }
    }
    .news-card {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      transition: transform 0.15s ease;
    }
    .news-card:active { transform: scale(0.98); }
    .news-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      /* इमेज लोड होईपर्यंत मधोमध App Icon दिसेल */
      background: #eef2ff url('icon-192.png') center / 56px no-repeat;
    }

    /* इमेज नसेल किंवा लोड झाली नाही तर आकर्षक Default Thumbnail */
    .news-img.is-fallback {
      object-fit: contain;
      padding: 20px;
      background: linear-gradient(135deg, #eef2ff 0%, #dbeafe 100%);
    }
    .news-content { padding: 10px 12px 12px; }
    .news-title {
      font-size: 16px;
      line-height: 1.4;
      font-weight: 700;
      color: #0A0989;
      margin-bottom: 6px;
    }
    .news-date { font-size: 12px; color: #777; font-weight: 600; }

    /* Skeleton Loader */
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skeleton-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .skeleton-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    .skeleton-body { padding: 12px; }
    .skeleton-line {
      height: 14px;
      border-radius: 6px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    .skeleton-line.short { width: 65%; }
    .skeleton-line.tiny { width: 35%; height: 10px; margin-bottom: 0; }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 16px;
    }
    .page-btn {
      min-width: 36px;
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #333;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .page-btn.active {
      background: #0A0989;
      color: #ffffff;
      border-color: #0A0989;
    }
    .page-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* YouTube Section */
    .yt-section {
      margin-top: 22px;
      background: linear-gradient(160deg, #18181b 0%, #27272a 100%);
      border-radius: 16px;
      padding: 16px 14px;
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    }
    .yt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .yt-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
    }
    .yt-heading i { color: #ff0000; font-size: 22px; }
    .yt-more {
      font-size: 13px;
      color: #fca5a5;
      text-decoration: none;
      font-weight: 600;
    }
    .yt-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 600px) {
      .yt-list { grid-template-columns: 1fr 1fr; }
    }
    .yt-card {
      display: flex;
      flex-direction: column;
      background: #303036;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      transition: transform 0.15s ease;
    }
    .yt-card:active { transform: scale(0.98); }
    .yt-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      /* व्हिडिओ थंबनेल लोड होईपर्यंत App Icon दिसेल */
      background: #1e1e24 url('icon-192.png') center / 56px no-repeat;
    }
    .yt-thumb-wrap img.is-fallback {
      object-fit: contain;
      padding: 20px;
      background: linear-gradient(135deg, #1e1e24 0%, #2d2d35 100%);
    }
    .yt-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .yt-play-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 46px;
      height: 32px;
      background: rgba(255, 0, 0, 0.9);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
    }
    .yt-info { padding: 10px 12px; }
    .yt-title {
      font-size: 15px;
      line-height: 1.35;
      font-weight: 600;
      color: #f4f4f5;
      margin-bottom: 4px;
    }
    .yt-date { font-size: 12px; color: #a1a1aa; }
    .yt-section .page-btn {
      background: #3f3f46;
      border-color: #52525b;
      color: #f4f4f5;
    }
    .yt-section .page-btn.active {
      background: #dc2626;
      border-color: #dc2626;
      color: #fff;
    }

    /* Bottom Social & Links */
    .bottom-links-box {
      margin-top: 24px;
      padding: 18px 12px 6px;
      text-align: center;
      border-top: 1px solid #e5e7eb;
    }
    .social-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }
    .social-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      text-decoration: none;
      box-shadow: 0 3px 8px rgba(0,0,0,0.12);
      transition: transform 0.15s ease;
    }
    .social-btn:active { transform: scale(0.92); }
    .sb-fb { background: #1877f2; }
    .sb-x  { background: #000000; }
    .sb-yt { background: #ff0000; }
    .sb-ig { background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af); }
    .sb-wa { background: #25d366; }

    .policy-links { font-size: 13px; color: #6b7280; }
    .policy-links a {
      color: #374151;
      text-decoration: none;
      font-weight: 600;
      margin: 0 6px;
    }
    .policy-links a:hover { color: #0A0989; }

    /* Offline Error Page Overlay */
    .offline-overlay {
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: #f4f6f9;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .offline-overlay.show { display: flex; }
    .offline-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .offline-icon-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #fee2e2;
      color: #dc2626;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .offline-title {
      font-size: 20px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 8px;
    }
    .offline-desc {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .retry-btn {
      background: #0A0989;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 25px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(10, 9, 137, 0.25);
    }
    .retry-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <!-- Offline Error Screen -->
  <div class="offline-overlay" id="offline-screen">
    <div class="offline-card">
      <div class="offline-icon-wrap">
        <i class="fa-solid fa-wifi"></i>
      </div>
      <div class="offline-title">इंटरनेट कनेक्शन नाही</div>
      <div class="offline-desc">ताज्या बातम्या आणि LIVE TV पाहण्यासाठी कृपया तुमचे मोबाईल डेटा किंवा Wi-Fi सुरू करा.</div>
      <button class="retry-btn" onclick="retryConnection()">
        <i class="fa-solid fa-rotate-right"></i> पुन्हा प्रयत्न करा
      </button>
    </div>
  </div>

  <!-- App Header -->
  <header class="app-header">
    <div class="app-title">Kokansad Live App</div>
    <button class="menu-btn" onclick="openDrawer()" aria-label="Menu">
      <i class="fa-solid fa-bars"></i>
    </button>
  </header>

  <!-- Right Slide Hamburger Drawer -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
  <aside class="side-drawer" id="side-drawer">
    <div class="drawer-header">
      <span>विभाग निवडा</span>
      <button class="drawer-close" onclick="closeDrawer()" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="drawer-list" id="drawer-list"></div>
    <div class="drawer-footer">
      <button class="drawer-action-btn btn-share" onclick="shareApp()">
        <i class="fa-solid fa-share-nodes"></i> Share App
      </button>
      <button class="drawer-action-btn btn-rate" onclick="rateApp()">
        <i class="fa-solid fa-star"></i> Rate This App
      </button>
    </div>
  </aside>

  <!-- Sticky Category Tabs -->
  <div class="tabs-container" id="tabs"></div>

  <div class="container-wrap">
    <!-- Live TV + E-Paper (फक्त ठळक बातम्या टॅबवर) -->
    <!-- Live TV Retro Frame (इतर टॅबवर Minimize होईल) -->
    <div class="tv-wrapper" id="tv-wrapper">
      <div class="tv-antennas" id="tv-antennas"></div>
      <div class="tv-frame" id="tv-frame">
        <div class="tv-box" id="tv-box">
          <button class="fs-exit-btn" onclick="exitFullscreen()">✕ बाहेर पडा</button>
          <div class="mini-controls">
            <button class="mini-btn" onclick="selectCategory(0)" title="Home वर जा">⤢</button>
            <button class="mini-btn" onclick="closeMiniTv()" title="TV बंद करा">✕</button>
          </div>
          <iframe
            id="live-tv-frame"
            src="https://cdn.rixcast.com/rcast/players/sindhudurglive.html"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>
        <div class="tv-bottom-bar" id="tv-bottom-bar">
          <div class="tv-live-badge">
            <span class="live-dot"></span>
            <span>कोकणसाद LIVE TV</span>
          </div>
          <div class="tv-action-btns">
            <button class="tv-ctrl-btn" onclick="reloadTv()" title="पुन्हा सुरू करा">
              <i class="fa-solid fa-rotate-right"></i> Play
            </button>
            <button class="tv-ctrl-btn fs-primary" id="fs-btn" onclick="toggleFullscreen()">
              <i class="fa-solid fa-expand"></i> Full Screen
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- E-Paper Banner (फक्त ठळक बातम्या टॅबवर) -->
    <div id="home-extras">
      <a href="http://epaper.thegoan.net/t/37473/latest/KONKANSAAD"
         target="_blank" rel="noopener noreferrer" class="epaper-banner">
        <div class="epaper-left">
          <div class="epaper-icon"><i class="fa-solid fa-newspaper"></i></div>
          <div>
            <div class="epaper-title">दैनिक कोकणसाद</div>
            <div class="epaper-tagline">स्वतंत्र, विश्वासार्ह आणि सडेतोड</div>
          </div>
        </div>
        <div class="epaper-cta">आजचा अंक वाचा &rarr;</div>
      </a>
    </div>

    <!-- News List + Pagination -->
    <div class="news-container" id="news-list"></div>
    <div class="pagination" id="news-pagination"></div>

    <!-- YouTube Videos Section (फक्त ठळक बातम्या खाली) -->
    <div class="yt-section" id="yt-section" style="display:none;">
      <div class="yt-header">
        <div class="yt-heading">
          <i class="fa-brands fa-youtube"></i>
          <span>कोकणसाद LIVE व्हिडिओज</span>
        </div>
        <a href="https://www.youtube.com/@KokansadLiveNews/videos" target="_blank" rel="noopener noreferrer" class="yt-more">
          सर्व पहा &rarr;
        </a>
      </div>
      <div class="yt-list" id="yt-list"></div>
      <div class="pagination" id="yt-pagination"></div>
    </div>

    <!-- Bottom Social Media & Links -->
    <div class="bottom-links-box">
      <div class="social-icons">
        <a href="https://www.facebook.com/kokansadlive" target="_blank" rel="noopener noreferrer" class="social-btn sb-fb" aria-label="Facebook">
          <i class="fa-brands fa-facebook-f"></i>
        </a>
        <a href="https://www.twitter.com/kokansadlive" target="_blank" rel="noopener noreferrer" class="social-btn sb-x" aria-label="X">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
        <a href="https://www.youtube.com/@KokansadLiveNews/videos" target="_blank" rel="noopener noreferrer" class="social-btn sb-yt" aria-label="YouTube">
          <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="https://www.instagram.com/kokansadlive/" target="_blank" rel="noopener noreferrer" class="social-btn sb-ig" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://whatsapp.com/channel/0029VaAq0GI4Y9lsqlvumu1p" target="_blank" rel="noopener noreferrer" class="social-btn sb-wa" aria-label="WhatsApp">
          <i class="fa-brands fa-whatsapp"></i>
        </a>
      </div>
      <div class="policy-links">
        <a href="https://kokansadlive.com/about_us.php" target="_blank" rel="noopener noreferrer">About Us</a> |
        <a href="https://kokansadlive.com/contact_us.php" target="_blank" rel="noopener noreferrer">Contact Us</a> |
        <a href="https://kokansadlive.com/privacy_policy.php" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
      </div>
    </div>
  </div>

  <script>
    // Play Store लिंक 
    const PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.kokansad.live.news';

    // PWA Service Worker नोंदणी
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // Right-click, Inspect आणि Copy बंद
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || (e.ctrlKey && ['u', 'U', 'c', 'C', 's', 'S'].includes(e.key))) {
        e.preventDefault();
      }
    });

    // Offline / Online Detection
    const offlineScreen = document.getElementById('offline-screen');
    function updateOnlineStatus() {
      if (!navigator.onLine) {
        offlineScreen.classList.add('show');
      } else {
        offlineScreen.classList.remove('show');
        if (allCategories.length === 0) loadNews();
      }
    }
    window.addEventListener('offline', updateOnlineStatus);
    window.addEventListener('online', updateOnlineStatus);

    function retryConnection() {
      if (navigator.onLine) {
        offlineScreen.classList.remove('show');
        loadNews();
      }
    }

    // Hamburger Drawer Control
    function openDrawer() {
      document.getElementById('drawer-overlay').classList.add('open');
      document.getElementById('side-drawer').classList.add('open');
    }
    function closeDrawer() {
      document.getElementById('drawer-overlay').classList.remove('open');
      document.getElementById('side-drawer').classList.remove('open');
    }

    // Share App & Rate App
    function shareApp() {
      closeDrawer();
      const shareData = {
        title: 'Kokansad Live app',
        text: 'कोकणातील ताज्या बातम्या, LIVE TV आणि दैनिक कोकणसाद ई-पेपरसाठी Kokansad Live App आजच install करून घ्या ..',
        url: PLAY_STORE_URL
      };
      if (navigator.share) {
        navigator.share(shareData).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(PLAY_STORE_URL);
        alert('Play Store लिंक कॉपी झाली आहे!');
      }
    }

    function rateApp() {
      closeDrawer();
      window.open(PLAY_STORE_URL, '_blank', 'noopener,noreferrer');
    }

    // Fullscreen & Back Button Handling
    const tvBox = document.getElementById('tv-box');
    const fsBtn = document.getElementById('fs-btn');
    let isFull = false;
	
	const LIVE_TV_URL = 'https://cdn.rixcast.com/rcast/players/sindhudurglive.html';
    const tvFrame = document.getElementById('live-tv-frame');
    let isTvClosed = false;

    function closeMiniTv() {
      isTvClosed = true;
      tvFrame.src = 'about:blank'; // आवाज पूर्णपणे बंद करण्यासाठी
      tvBox.style.display = 'none';
    }
	
	function reloadTv() {
      isTvClosed = false;
      tvBox.style.display = 'block';
      tvFrame.src = LIVE_TV_URL;
    }

    async function enterFullscreen() {
      if (isFull) return;
      isFull = true;
      tvBox.classList.add('is-fullscreen');
      fsBtn.textContent = '✕ बाहेर पडा';
      history.pushState({ tvFullscreen: true }, '');
      try {
        if (tvBox.requestFullscreen) await tvBox.requestFullscreen();
        else if (tvBox.webkitRequestFullscreen) tvBox.webkitRequestFullscreen();
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape').catch(() => {});
        }
      } catch (e) {}
    }

    function exitFullscreen(fromPopstate = false) {
      if (!isFull) return;
      isFull = false;
      tvBox.classList.remove('is-fullscreen');
      fsBtn.innerHTML = '<i class="fa-solid fa-expand"></i> Full Screen';
      try {
        if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
      } catch (e) {}
      if (!fromPopstate && history.state && history.state.tvFullscreen) history.back();
    }

    function toggleFullscreen() {
      if (isFull) exitFullscreen();
      else enterFullscreen();
    }

    // मोबाईल Back Button: आधी Fullscreen बंद करा, अन्यथा इतर कॅटेगरीवरून 'ठळक बातम्या' वर या
    window.addEventListener('popstate', () => {
      if (isFull) {
        exitFullscreen(true);
        return;
      }
      if (activeCatIndex !== 0) {
        selectCategory(0, true);
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && isFull) exitFullscreen();
    });

    // State
    let allCategories = [];
    let youtubeVideos = [];
    let activeCatIndex = 0;
    const NEWS_PER_PAGE = 10;
    const YT_PER_PAGE = 6; // ६ YouTube व्हिडिओज प्रति पेज

    function showSkeletons(count = 4) {
      document.getElementById('news-list').innerHTML = Array(count).fill(`
        <div class="skeleton-card">
          <div class="skeleton-img"></div>
          <div class="skeleton-body">
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
            <div class="skeleton-line tiny"></div>
          </div>
        </div>
      `).join('');
    }

    async function loadNews() {
      if (!navigator.onLine) {
        offlineScreen.classList.add('show');
        return;
      }
      showSkeletons(4);
      try {
        const res = await fetch('news.json?t=' + new Date().getTime());
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();
        allCategories = data.categories || [];
        youtubeVideos = data.youtube || [];
        offlineScreen.classList.remove('show');
        renderNavigation();
        if (allCategories.length > 0) renderNews(0, 1);
        renderYouTube(1);
      } catch (err) {
        offlineScreen.classList.add('show');
      }
    }

    function renderNavigation() {
      const tabsEl = document.getElementById('tabs');
      const drawerEl = document.getElementById('drawer-list');

      tabsEl.innerHTML = allCategories.map((cat, idx) => `
        <button class="tab-btn ${idx === 0 ? 'active' : ''}" data-idx="${idx}" onclick="selectCategory(${idx})">
          ${cat.name}
        </button>
      `).join('');

      drawerEl.innerHTML = allCategories.map((cat, idx) => `
        <button class="drawer-item ${idx === 0 ? 'active' : ''}" data-idx="${idx}" onclick="selectCategory(${idx})">
          <span>${cat.name}</span>
          <i class="fa-solid fa-chevron-right" style="font-size:12px;opacity:0.5;"></i>
        </button>
      `).join('');
    }

    function selectCategory(index, fromPopstate = false) {
      const prevIndex = activeCatIndex;

      // ठळक बातम्या (0) वर परत आल्यास history state स्वच्छ करा
      if (index === 0 && !fromPopstate && history.state && history.state.catPage) {
        history.back();
        return;
      }

      // ठळक बातम्यांवरून दुसऱ्या कॅटेगरीत जाताना Back Button साठी history state जोडा
      if (prevIndex === 0 && index !== 0 && !fromPopstate) {
        history.pushState({ catPage: true }, '');
      }

      activeCatIndex = index;
      closeDrawer();

      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', Number(b.dataset.idx) === index);
        if (Number(b.dataset.idx) === index) {
          b.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      });
      document.querySelectorAll('.drawer-item').forEach(b => {
        b.classList.toggle('active', Number(b.dataset.idx) === index);
      });

      const isHome = (index === 0);
      document.getElementById('home-extras').style.display = isHome ? 'block' : 'none';
      document.getElementById('yt-section').style.display = (isHome && youtubeVideos.length > 0) ? 'block' : 'none';

      // Live TV Minimize / Restore लॉजिक
      const tvAntennas = document.getElementById('tv-antennas');
      const tvFrameBox = document.getElementById('tv-frame');
      const tvBottomBar = document.getElementById('tv-bottom-bar');

      if (isHome) {
        tvAntennas.style.display = 'block';
        tvBottomBar.style.display = 'flex';
        tvFrameBox.style.background = '#1a2a47';
        tvFrameBox.style.padding = '8px 8px 10px';
        tvBox.classList.remove('is-minimized');
        tvBox.style.display = 'block';
        if (isTvClosed) {
          tvFrame.src = LIVE_TV_URL;
          isTvClosed = false;
        }
      } else {
        tvAntennas.style.display = 'none';
        tvBottomBar.style.display = 'none';
        tvFrameBox.style.background = 'transparent';
        tvFrameBox.style.padding = '0';
        if (!isTvClosed) {
          tvBox.classList.add('is-minimized');
        }
      }

      renderNews(index, 1);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
	
	// Broken किंवा Missing इमेजसाठी Default Thumbnail हँडलर
    function handleImgError(img) {
      img.onerror = null;
      img.src = 'icon-192.png';
      img.classList.add('is-fallback');
    }

    function renderNews(catIdx, page) {
      const listEl = document.getElementById('news-list');
      const pagEl = document.getElementById('news-pagination');
      const items = allCategories[catIdx]?.items || [];

      if (items.length === 0) {
        listEl.innerHTML = '<div style="text-align:center;padding:30px;color:#666;">या विभागात सध्या बातम्या उपलब्ध नाहीत.</div>';
        pagEl.innerHTML = '';
        return;
      }

      const totalPages = Math.ceil(items.length / NEWS_PER_PAGE);
      const start = (page - 1) * NEWS_PER_PAGE;
      const pageItems = items.slice(start, start + NEWS_PER_PAGE);

      listEl.innerHTML = pageItems.map(item => `
        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="news-card">
          <img src="${item.image || 'icon-192.png'}" alt="" class="news-img ${!item.image ? 'is-fallback' : ''}" loading="lazy" onerror="handleImgError(this)">
          <div class="news-content">
            <div class="news-title">${item.title}</div>
            <div class="news-date">${item.date}</div>
          </div>
        </a>
      `).join('');

      if (totalPages > 1) {
        let html = `<button class="page-btn" ${page === 1 ? 'disabled' : ''} onclick="changeNewsPage(${page - 1})">&laquo; मागील</button>`;
        for (let i = 1; i <= totalPages; i++) {
          html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="changeNewsPage(${i})">${i}</button>`;
        }
        html += `<button class="page-btn" ${page === totalPages ? 'disabled' : ''} onclick="changeNewsPage(${page + 1})">पुढील &raquo;</button>`;
        pagEl.innerHTML = html;
      } else {
        pagEl.innerHTML = '';
      }
    }

    function changeNewsPage(page) {
      renderNews(activeCatIndex, page);
      document.getElementById('news-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderYouTube(page) {
      const sectionEl = document.getElementById('yt-section');
      const listEl = document.getElementById('yt-list');
      const pagEl = document.getElementById('yt-pagination');

      if (!youtubeVideos.length || activeCatIndex !== 0) {
        sectionEl.style.display = 'none';
        return;
      }

      sectionEl.style.display = 'block';
      const totalPages = Math.ceil(youtubeVideos.length / YT_PER_PAGE);
      const start = (page - 1) * YT_PER_PAGE;
      const pageItems = youtubeVideos.slice(start, start + YT_PER_PAGE);

      listEl.innerHTML = pageItems.map(v => `
        <a href="${v.link}" target="_blank" rel="noopener noreferrer" class="yt-card">
          <div class="yt-thumb-wrap">
            <img src="${v.image || 'icon-192.png'}" alt="" class="${!v.image ? 'is-fallback' : ''}" loading="lazy" onerror="handleImgError(this)">
            <div class="yt-play-badge"><i class="fa-solid fa-play"></i></div>
          </div>
          <div class="yt-info">
            <div class="yt-title">${v.title}</div>
            <div class="yt-date">${v.date}</div>
          </div>
        </a>
      `).join('');

      if (totalPages > 1) {
        let html = `<button class="page-btn" ${page === 1 ? 'disabled' : ''} onclick="changeYtPage(${page - 1})">&laquo;</button>`;
        for (let i = 1; i <= totalPages; i++) {
          html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="changeYtPage(${i})">${i}</button>`;
        }
        html += `<button class="page-btn" ${page === totalPages ? 'disabled' : ''} onclick="changeYtPage(${page + 1})">&raquo;</button>`;
        pagEl.innerHTML = html;
      } else {
        pagEl.innerHTML = '';
      }
    }

    function changeYtPage(page) {
      renderYouTube(page);
      document.getElementById('yt-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    loadNews();
  </script>
</body>
</html>
